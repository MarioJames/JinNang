[package]
name = "jinnang"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local credential vault for AI agents: agents hold jn:// references, secrets stay sealed"
license = "Apache-2.0"
repository = "https://github.com/MarioJames/JinNang"

[dependencies]
age = { version = "0.12.1", features = ["armor"] }
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hex = "0.4.3"
rpassword = "7.5.4"
rustix = { version = "1.1.6", features = ["fs", "process", "thread", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde", "macros"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zeroize = { version = "1.9.1", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
